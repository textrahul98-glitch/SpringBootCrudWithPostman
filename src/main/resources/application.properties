spring.application.name=SpringbootWithPostaman
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/java26}
spring.datasource.username=${DB_USERNAME:root}

name: Build and SonarQube Pipeline

on:
  push:
    branches:
      - main

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      # 1. Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Setup Java 21
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # 3. Check Java version
      - name: Check Java version
        run: java -version

      # 4. Check Maven version
      - name: Check Maven version
        run: mvn -version

      # 5. Clean project
      - name: Maven Clean
        run: mvn clean

      # 6. Compile project
      - name: Maven Compile
        run: mvn compile

      # 7. Run tests
      - name: Maven Test
        run: mvn test

      # 8. Package application
      - name: Maven Package
        run: mvn package -DskipTests

      # 9. SonarQube Analysis
      - name: SonarQube Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          mvn sonar:sonar \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.token="$SONAR_TOKEN"
